{% extends "layouts/base.html" %}

{% block title %}
Iniciar Sesión
{% endblock %}

{% block css %}
<link rel="stylesheet" href="/static/css/login.css">
{% endblock %}

{% block content %}

<div class="login">

    <h1>EL IMPERIO DEL BARRIL</h1>

    <h3>Iniciar Sesión</h3>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Correo"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit">

            INGRESAR

        </button>

    </form>

    <p id="mensaje"></p>

</div>

{% endblock %}

{% block scripts %}

<script src="/static/js/login.js"></script>

{% endblock %}
