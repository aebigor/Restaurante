<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17110d">
    <title>{% block title %}El Imperio del Barril{% endblock %}</title>
    {% block css %}{% endblock %}
</head>
<body>
<script>
(function () {
    const path = window.location.pathname;
    const token = localStorage.getItem("token");
    let user = null;

    try { user = JSON.parse(localStorage.getItem("user") || "null"); }
    catch (_) { user = null; }

    // Las vistas públicas no necesitan sesión.
    const publicPaths = path === "/" || path === "/login" || path === "/register" || path === "/admin/login" || path.startsWith("/m/");
    if (!token || !user) {
        if (!publicPaths && path !== "/favicon.ico") window.location.replace("/");
        return;
    }

    const role = user.role;
    const redirects = {
        Administrador: "/admin",
        Caja: "/cashier",
        Mesero: "/waiter",
        Cocina: "/kitchen",
        Parrilla: "/kitchen",
        Sopas: "/kitchen",
        Cliente: "/"
    };

    if (path.startsWith("/admin") && path !== "/admin/login" && role !== "Administrador") {
        window.location.replace(redirects[role] || "/");
        return;
    }

    if (path === "/cashier" && role !== "Caja") {
        window.location.replace(redirects[role] || "/");
        return;
    }
})();
</script>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
