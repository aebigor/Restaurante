<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17110d">
    <title>{% block title %}El Imperio del Barril{% endblock %}</title>
    {% block css %}{% endblock %}
</head>
<body>
<script>
(function () {
    const path = window.location.pathname;

    // La sesión del cliente tiene almacenamiento propio. Esto evita que una
    // pestaña de Caja/Admin/Domiciliario pueda reemplazar el token del cliente.
    const customerPath = path === "/mis-pedidos" || path === "/checkout";
    const token = customerPath
        ? (localStorage.getItem("customer_token") || localStorage.getItem("token"))
        : localStorage.getItem("token");
    let user = null;

    try {
        user = JSON.parse(
            customerPath
                ? (localStorage.getItem("customer_user") || localStorage.getItem("user") || "null")
                : (localStorage.getItem("user") || "null")
        );
    } catch (_) { user = null; }

    // Las vistas públicas no necesitan sesión.
    const publicPaths = path === "/" || path === "/login" || path === "/register" || path === "/terms" || path === "/privacy" || path === "/admin/login" || path.startsWith("/m/");
    if (!token || !user) {
        if (!publicPaths && path !== "/favicon.ico") window.location.replace("/");
        return;
    }

    // Sincroniza la sesión guardada con el backend. Esto evita que el
    // navegador conserve un estado viejo después de registrarse o iniciar sesión.
    if (token && user) {
        fetch("/auth/me", { headers: { Authorization: `Bearer ${token}` } })
            .then(r => { if (!r.ok) throw new Error("session"); return r.json(); })
            .then(data => {
                if (data?.user) {
                    if (customerPath && data.user?.role === "Cliente") {
                        localStorage.setItem("customer_user", JSON.stringify(data.user));
                        localStorage.setItem("customer_token", token);
                    } else {
                        localStorage.setItem("user", JSON.stringify(data.user));
                    }
                    window.dispatchEvent(new CustomEvent("customer-auth-ready", { detail: data.user }));
                }
            })
            .catch(() => {
                if (customerPath) {
                    localStorage.removeItem("customer_token");
                    localStorage.removeItem("customer_user");
                } else {
                    localStorage.removeItem("token");
                    localStorage.removeItem("user");
                }
            });
    }

    const role = user.role;
    const redirects = {
        Administrador: "/admin",
        Caja: "/cashier",
        Mesero: "/waiter",
        Cocina: "/kitchen",
        Parrilla: "/kitchen",
        Sopas: "/kitchen",
        Domiciliario: "/domiciliario",
        Cliente: "/"
    };

    if (path.startsWith("/admin") && path !== "/admin/login" && role !== "Administrador") {
        window.location.replace(redirects[role] || "/");
        return;
    }

    if (path === "/cashier" && role !== "Caja") {
        window.location.replace(redirects[role] || "/");
        return;
    }
    if (path === "/domiciliario" && role !== "Domiciliario") {
        window.location.replace(redirects[role] || "/");
        return;
    }
})();
</script>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
