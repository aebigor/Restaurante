<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>{% block title %}{% endblock %}</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    {% block css %}
    {% endblock %}

</head>

<body>

<script>
(function () {
    const path = window.location.pathname;
    const token = localStorage.getItem("token");
    let user = null;

    try { user = JSON.parse(localStorage.getItem("user") || "null"); }
    catch (_) { user = null; }

    if (!token || !user) {
        if (path !== "/" && !path.startsWith("/m/")) window.location.replace("/");
        return;
    }

    const role = user.role;
    const redirects = {
        Administrador: "/admin",
        Caja: "/cashier",
        Mesero: "/waiter",
        Cocina: "/kitchen",
        Parrilla: "/kitchen",
        Sopas: "/kitchen"
    };

    if (path.startsWith("/admin") && role !== "Administrador") {
        window.location.replace(redirects[role] || "/");
        return;
    }

    if (path === "/cashier" && role !== "Caja") {
        window.location.replace(redirects[role] || "/");
    }
})();
</script>

{% block content %}
{% endblock %}

{% block scripts %}
{% endblock %}

</body>

</html>
