<header class="cashier-topbar">
    <div class="cashier-topbar-left">
        <button class="cashier-menu-button" id="cashierMenuButton" type="button" aria-label="Abrir menú">
            ☰
        </button>
        <div>
            <span class="cashier-topbar-kicker">PUNTO DE VENTA</span>
            <h2>Operación de caja</h2>
        </div>
    </div>

    <div class="cashier-topbar-right">
        <div class="cashier-user">
            <div class="cashier-avatar">CA</div>
            <div class="cashier-user-info">
                <strong id="cashierUserName">Cajero</strong>
                <small>Caja</small>
            </div>
        </div>

        <button class="cashier-notification" type="button" title="Notificaciones">🔔</button>

        <a href="#" id="logoutBtn" class="cashier-logout">Cerrar sesión</a>
    </div>
</header>
