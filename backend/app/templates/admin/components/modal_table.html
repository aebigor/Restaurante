<div id="modalMesa" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                Nueva Mesa
            </h2>

            <button
                id="btnCerrarModal"
                class="btn-close"
            >
                ✕
            </button>

        </div>

        <form id="formMesa">

            <input
                type="hidden"
                id="mesaId"
            >

            <div class="form-group">

                <label>

                    Nombre

                </label>

                <input
                    id="name"
                    type="text"
                    required
                >

            </div>

            <div class="grid-2">

                <div class="form-group">

                    <label>

                        Número

                    </label>

                    <input
                        id="number"
                        type="number"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>

                        Capacidad

                    </label>

                    <input
                        id="capacity"
                        type="number"
                        min="1"
                        value="4"
                    >

                </div>

            </div>

            <div class="form-group">

                <label>

                    Zona

                </label>

                <select id="zone">

                    <option value="Salón">

                        Salón

                    </option>

                    <option value="Terraza">

                        Terraza

                    </option>

                    <option value="VIP">

                        VIP

                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>

                    Activa

                </label>

                <input
                    id="active"
                    type="checkbox"
                    checked
                >

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    id="btnCancelar"
                    class="btn-secondary"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Guardar
                </button>

            </div>

        </form>

    </div>

</div>
